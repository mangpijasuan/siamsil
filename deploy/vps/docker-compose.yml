# Siamsil API on one small server: Caddy (HTTPS) -> API -> PostgreSQL. See docs/DEPLOY_VPS.md.
# Run from this folder: `docker compose --env-file .env up -d --build`.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: siamsil
      POSTGRES_USER: siamsil
      # Use only letters and digits (openssl rand -hex 32): the password is placed inside a database URL.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siamsil -d siamsil"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - siamsil_postgres:/var/lib/postgresql/data
    # No ports: only the API container can reach the database.

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SIAMSIL_ENVIRONMENT: production
      SIAMSIL_DATABASE_URL: postgresql+psycopg://siamsil:${POSTGRES_PASSWORD}@postgres:5432/siamsil
      SIAMSIL_DATABASE_REQUIRED: "true"
      SIAMSIL_CORS_ORIGINS: "${SIAMSIL_CORS_ORIGINS:?set SIAMSIL_CORS_ORIGINS in .env}"
      # Ask for a limit per client per minute (0 turns it off). Caddy is the only thing that reaches the API
      # (no ports are published), so trusting its forwarded address is safe and counts each real visitor.
      SIAMSIL_RATE_LIMIT_PER_MINUTE: ${SIAMSIL_RATE_LIMIT_PER_MINUTE:-120}
      FORWARDED_ALLOW_IPS: "*"
      SIAMSIL_DATA_BUNDLE_S3_ENDPOINT: ${SIAMSIL_DATA_BUNDLE_S3_ENDPOINT:?}
      SIAMSIL_DATA_BUNDLE_S3_BUCKET: ${SIAMSIL_DATA_BUNDLE_S3_BUCKET:-siamsil-data-bundle}
      # The object to install. Keep each release under its own dated name in R2 so you can roll back.
      SIAMSIL_DATA_BUNDLE_S3_KEY: ${SIAMSIL_DATA_BUNDLE_S3_KEY:-siamsil-data.tar.gz}
      SIAMSIL_DATA_BUNDLE_S3_ACCESS_KEY_ID: ${SIAMSIL_DATA_BUNDLE_S3_ACCESS_KEY_ID:?}
      SIAMSIL_DATA_BUNDLE_S3_SECRET_ACCESS_KEY: ${SIAMSIL_DATA_BUNDLE_S3_SECRET_ACCESS_KEY:?}
      SIAMSIL_DATA_BUNDLE_SHA256: ${SIAMSIL_DATA_BUNDLE_SHA256:?}
      # The release manifest (release.json) pinned by its own SHA-256, as the bundle is. Production refuses to start
      # without it (docs/DATA_RELEASES.md). SIAMSIL_RIGHTS_SHA256 optionally pins the rights register to expect.
      SIAMSIL_DATA_RELEASE_MANIFEST_SHA256: ${SIAMSIL_DATA_RELEASE_MANIFEST_SHA256:?set the release.json SHA-256 in .env}
      SIAMSIL_DATA_RELEASE_MANIFEST_KEY: ${SIAMSIL_DATA_RELEASE_MANIFEST_KEY:-}
      SIAMSIL_RIGHTS_SHA256: ${SIAMSIL_RIGHTS_SHA256:-}
      # The 1.77M-pair parallel corpus is blocked in data/rights.json; hidden by default, keep it that way.
      SIAMSIL_SERVE_PARALLEL_CORPUS: ${SIAMSIL_SERVE_PARALLEL_CORPUS:-false}
    volumes:
      - siamsil_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    # No ports: only Caddy reaches the API.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - siamsil_caddy_data:/data
      - siamsil_caddy_config:/config
    depends_on:
      - api

volumes:
  siamsil_postgres:
  siamsil_data:
  siamsil_caddy_data:
  siamsil_caddy_config:
