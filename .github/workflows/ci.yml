name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: siamsil_test
          POSTGRES_USER: siamsil
          POSTGRES_PASSWORD: siamsil-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U siamsil -d siamsil_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SIAMSIL_ENVIRONMENT: test
      SIAMSIL_DATABASE_URL: postgresql+psycopg://siamsil:siamsil-test-only@127.0.0.1:5432/siamsil_test
      SIAMSIL_DATABASE_REQUIRED: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            ml_pipeline/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt -r ml_pipeline/requirements.txt

      - name: Verify database migrations
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check

      - name: Run backend and language tests
        run: python -m unittest discover -s backend/tests -p "test_*.py"

      - name: Check committed OpenAPI contract
        run: |
          python backend/scripts/export_openapi.py frontend/openapi.json
          git diff --exit-code -- frontend/openapi.json

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check generated API types
        run: |
          npm exec openapi-typescript openapi.json -o lib/generated/api-types.ts
          git diff --exit-code -- lib/generated/api-types.ts

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8001
          SIAMSIL_API_URL: http://127.0.0.1:8001
